name: Render profile banner
on:
  push:
    paths:
      - 'assets/hero.svg'
      - '.github/workflows/render-banner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render PNG from SVG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/hero.svg',write_to='assets/hero.png',output_width=2048,output_height=683)
          PY
      - name: Commit generated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render PNG banner for profile compatibility"
            git push
          fi
