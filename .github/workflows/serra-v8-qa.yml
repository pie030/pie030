name: Serra do Eter V8 browser smoke
on:
  push:
    branches:
      - serra-do-eter-v8-world-evolution
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/serra-http.log 2>&1 &
          sleep 3
      - name: Test WebGL, road trip, minimap, HUD, mobile
        run: node tests/serra-v8-smoke.mjs
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serra-v8-qa-screenshots
          path: artifacts/
          if-no-files-found: ignore
