<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="bannerTitle bannerDescription">
<title id="bannerTitle">Pietro Braz — creative development, interactive worlds</title>
<desc id="bannerDescription">An editorial art-directed banner with warm off-white typography and an architectural folded-form sculpture on a forest-black field.</desc>
<defs>
  <clipPath id="frame"><rect width="1440" height="480" rx="0"/></clipPath>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F1E8"/><stop offset="1" stop-color="#EBE8DF"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#263731"/><stop offset="1" stop-color="#152622"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFA989"/><stop offset="0.45" stop-color="#DF694F"/><stop offset="1" stop-color="#A63932"/></linearGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1C5AA"/><stop offset="0.5" stop-color="#EBA27F"/><stop offset="1" stop-color="#D36E56"/></linearGradient>
  <linearGradient id="darkSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B95D48"/><stop offset="1" stop-color="#703D39"/></linearGradient>
  <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CED7C0"/><stop offset="1" stop-color="#789889"/></linearGradient>
  <linearGradient id="inside" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#283E37"/><stop offset="1" stop-color="#4C6051"/></linearGradient>
  <filter id="shadow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="papergrain" patternUnits="userSpaceOnUse" width="48" height="48"><circle cx="5" cy="12" r=".5" fill="#64625F" opacity=".15"/><circle cx="32" cy="37" r=".6" fill="#64625F" opacity=".12"/><circle cx="41" cy="9" r=".5" fill="#64625F" opacity=".12"/></pattern>
</defs>
<g clip-path="url(#frame)">
  <rect width="1440" height="480" fill="url(#paper)"/>
  <rect width="1440" height="480" fill="url(#papergrain)" opacity=".7"/>
  <rect x="854" width="586" height="480" fill="url(#dark)"/>
  <path d="M853.5 0V480" stroke="#D9D5CA" stroke-width="1"/>
  <text x="86" y="76" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="2" font-weight="700" fill="#1A2825">PIETRO BRAZ</text>
  <circle cx="273" cy="70" r="3" fill="#CE7258"/>
  <text x="295" y="76" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2.5" fill="#5D6962">CREATIVE DEVELOPMENT</text>
  <path d="M86 104H787" stroke="#B5BAB0" stroke-width="1"/>
  <text x="78" y="236" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="111" letter-spacing="-4" fill="#1A2825">Curiosity</text>
  <text x="81" y="346" font-family="Arial,Helvetica,sans-serif" font-size="94" letter-spacing="-5" font-weight="700" fill="#1A2825">has structure</text>
  <text x="88" y="397" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing=".25" fill="#5D6962">Interactive worlds, digital objects, working ideas.</text>
  <path d="M86 436H787" stroke="#B5BAB0" stroke-width="1"/>
  <text x="88" y="459" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.9" fill="#51605A">01  /  EXPERIMENTS IN DIGITAL FORM</text>
  <text x="902" y="65" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2.3" fill="#D6DFD1">FORM STUDY</text>
  <text x="1323" y="65" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.6" fill="#D6DFD1">001</text>
  <path d="M900 83H1374" stroke="#9EB2A4" stroke-opacity=".31"/>
  <!-- The sculptural planes are drawn as overlapping folded surfaces, not a stock illustration. -->
  <ellipse cx="1161" cy="395" rx="215" ry="38" fill="#060F0E" opacity=".7" filter="url(#shadow)"/>
  <path d="M1026 345L1155 125L1213 135L1091 362Z" fill="#667F70"/>
  <path d="M1091 362L1159 388L1286 166L1213 135Z" fill="#31483E"/>
  <path d="M1155 125L1205 103L1263 113L1213 135Z" fill="#B3C1A5"/>
  <path d="M1155 125L1205 103L1366 267L1312 282Z" fill="url(#flame)"/>
  <path d="M1312 282L1366 267L1366 325L1309 338Z" fill="#8F4E42"/>
  <path d="M1155 125L1312 282L1309 338L1146 182Z" fill="url(#copper)"/>
  <path d="M1146 182L1309 338L1255 356L1095 208Z" fill="#A34539"/>
  <path d="M1005 283L1125 219L1245 329L1121 391Z" fill="url(#cool)"/>
  <path d="M1121 391L1245 329L1250 369L1125 433Z" fill="#647E74"/>
  <path d="M1005 283L1121 391L1125 433L999 317Z" fill="#8BA397"/>
  <path d="M1090 308L1132 286L1185 334L1143 356Z" fill="url(#inside)"/>
  <path d="M1090 308L1143 356" stroke="#F0E5D1" stroke-opacity=".5" stroke-width="2"/>
  <path d="M1125 219L1245 329" stroke="#E6E7D6" stroke-opacity=".55" stroke-width="2"/>
  <path d="M1155 125L1312 282" stroke="#F7D2B5" stroke-opacity=".45" stroke-width="2"/>
  <path d="M1005 283L1125 219" stroke="#F5F0DB" stroke-opacity=".65" stroke-width="2"/>
  <circle cx="1026" cy="346" r="3" fill="#EFD2B0"/>
  <circle cx="1366" cy="325" r="3" fill="#DFA48E"/>
  <path d="M899 437H1374" stroke="#9EB2A4" stroke-opacity=".31"/>
  <text x="902" y="457" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.4" fill="#AEC3B5">BUILD  /  EXPERIMENT  /  REFINE</text>
  <text x="1357" y="457" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#AEC3B5">P/B</text>
</g>
</svg>